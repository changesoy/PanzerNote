[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PanzerNote"
dynamic = ["version"]
description = "战车少女主题笔记工具 - Markdown编辑、插件系统、主题引擎、挂机资源收集"
authors = [
    {name = "Changes"},
]
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
]
dependencies = [
    "PyQt6>=6.11.0",
    "PyQt6-WebEngine>=6.11.0",
    "shiboken6>=6.11.2",  # PyQt6 绑定，isValid 校验 C++ 对象存活（main_window.py 直接导入）
    "Pygments>=2.21.0",
    "markdown>=3.10.3",
    "Pillow>=12.3.0",
    "send2trash>=2.1.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",  # markdown 渲染扩展语法（定义列表/任务列表）
]

[project.optional-dependencies]
format = [
    "PyYAML>=6.0.3",
    "tomli>=2.4.1",
    "tomli-w>=1.2.0",
    "cssbeautifier>=2.0.3",
    "html5lib>=1.1",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4",
    "mypy>=2.3.1",
]
all = [
    "PanzerNote[format,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: 单元测试，纯逻辑无 GUI 依赖",
    "gui: GUI 测试，需要 QApplication / qtbot",
    "slow: 耗时较长的测试",
    "benchmark: 性能基准测试",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["PyQt6.*", "PyQt6.QtCore", "PyQt6.QtWidgets", "PyQt6.QtGui", "PyQt6.QtWebEngineWidgets", "markdown", "pygments.*", "yaml", "cssbeautifier", "send2trash"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.core.config", "src.utils.logger", "src.utils.exceptions", "src.core.event_bus", "src.core.timer_manager", "src.core.menu_builder", "src.game.game_engine"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "src.editor.editor_actions"
disallow_untyped_defs = true
disable_error_code = ["attr-defined", "arg-type", "return-value"]

[[tool.mypy.overrides]]
module = "src.editor.auto_pair_handler"
disallow_untyped_defs = true
disable_error_code = ["attr-defined", "arg-type", "misc"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}
