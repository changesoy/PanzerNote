[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
strict_equality = True
show_error_codes = True
show_column_numbers = True
show_error_context = True

[mypy-PyQt5.*]
ignore_missing_imports = True

[mypy-PyQt5.QtCore]
ignore_missing_imports = True

[mypy-PyQt5.QtWidgets]
ignore_missing_imports = True

[mypy-PyQt5.QtGui]
ignore_missing_imports = True

[mypy-markdown]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-pygments.*]
ignore_missing_imports = True

[mypy-src.core.config]
disallow_untyped_defs = True

[mypy-src.utils.logger]
disallow_untyped_defs = True

[mypy-src.utils.exceptions]
disallow_untyped_defs = True

[mypy-src.core.event_bus]
disallow_untyped_defs = True

[mypy-src.core.timer_manager]
disallow_untyped_defs = True

[mypy-src.core.menu_builder]
disallow_untyped_defs = True

[mypy-src.game.game_engine]
disallow_untyped_defs = True

[mypy-src.editor.editor_actions]
disallow_untyped_defs = True
disable_error_code = attr-defined, arg-type, return-value

[mypy-src.editor.auto_pair_handler]
disallow_untyped_defs = True
disable_error_code = attr-defined, arg-type, misc
