[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PanzerNote"
dynamic = ["version"]
description = "战车少女主题记事本"
authors = [
    {name = "Changes"},
]
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
]
dependencies = [
    "PyQt6>=6.8.0",
    "PyQt6-WebEngine>=6.8.0",
    "Pygments>=2.19",
    "markdown>=3.8",
    "Pillow>=12.2.0",
    "cryptography>=48.0.0",
    "send2trash>=2.1.0",
    "markdown-it-py>=3.0.0",
]

[project.optional-dependencies]
preview = [
    "PyQt6-WebEngine>=6.8.0",
    "markdown-it-py>=3.0.0",
]
format = [
    "PyYAML>=6.0",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "cssbeautifier>=1.4",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "mypy>=1.20",
]
all = [
    "PanzerNote[preview,format,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["PyQt6.*", "PyQt6.QtCore", "PyQt6.QtWidgets", "PyQt6.QtGui", "PyQt6.QtWebEngineWidgets", "markdown", "PIL.*", "pygments.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.core.config", "src.utils.logger", "src.utils.exceptions", "src.core.event_bus", "src.core.timer_manager", "src.core.menu_builder", "src.game.game_engine"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "src.editor.editor_actions"
disallow_untyped_defs = true
disable_error_code = ["attr-defined", "arg-type", "return-value"]

[[tool.mypy.overrides]]
module = "src.editor.auto_pair_handler"
disallow_untyped_defs = true
disable_error_code = ["attr-defined", "arg-type", "misc"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}
