[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "PanzerNote"
version = "1.6.4"
description = "战车少女主题记事本"
authors = [
    {name = "Changes"},
]
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors",
]
dependencies = [
    "PyQt5>=5.15.10",
    "Pygments>=2.18",
    "markdown>=3.7",
    "Pillow>=10.0.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "mypy>=1.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
show_error_context = true

[[tool.mypy.overrides]]
module = ["PyQt5.*", "PyQt5.QtCore", "PyQt5.QtWidgets", "PyQt5.QtGui", "markdown", "PIL.*", "pygments.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.core.config", "src.utils.logger", "src.utils.exceptions", "src.core.event_bus", "src.core.timer_manager", "src.core.menu_builder", "src.game.game_engine"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "src.editor.editor_actions"
disallow_untyped_defs = true
disable_error_code = ["attr-defined", "arg-type", "return-value"]

[[tool.mypy.overrides]]
module = "src.editor.auto_pair_handler"
disallow_untyped_defs = true
disable_error_code = ["attr-defined", "arg-type", "misc"]
